name: Test CHD converter

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install conversion tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mame-tools ffmpeg
      - name: Install conversion tools (macOS)
        if: runner.os == 'macOS'
        run: brew install rom-tools ffmpeg
      - name: Run unit and integration tests
        run: python3 -m unittest discover -s tests -v
